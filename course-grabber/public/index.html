<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCUT 抢课助手</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>⚡ SCUT 抢课助手</h1>
      <p class="sub">教务选课（自主选课-预选）· 登录后自动探测开放 · 温和并发提交</p>
    </header>

    <!-- 状态栏 -->
    <div class="statusbar">
      <span class="status-dot" id="phase-dot"></span>
      <span id="phase-text">未登录</span>
      <span class="grow"></span>
      <span id="course-count"></span>
      <button class="btn ghost" id="btn-about" title="说明">?</button>
    </div>

    <!-- 配置 / 登录 -->
    <section class="card" id="sec-login">
      <h2>1. 配置并登录教务</h2>
      <div class="row">
        <label>学号 <input id="username" placeholder="学号" /></label>
        <label>查询密码 <input id="password" type="password" placeholder="查询密码" /></label>
      </div>
      <div class="row">
        <label>代理（可选） <input id="proxy" placeholder="如 socks5://127.0.0.1:7890" /></label>
      </div>

      <div id="captcha-area" class="hidden">
        <div class="row">
          <img id="captcha-img" alt="验证码" />
          <label>
            验证码
            <span class="captcha-wrap">
              <input id="captcha" placeholder="验证码" autocomplete="off" />
              <button class="btn tiny" id="btn-captcha-refresh">换一张</button>
            </span>
          </label>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" id="btn-login">登录教务</button>
        <span id="login-msg" class="msg"></span>
      </div>
    </section>

    <!-- 探测开放 -->
    <section class="card hidden" id="sec-wait">
      <h2>2. 探测选课开放</h2>
      <p class="hint">登录后自动开始探测。选课开放前每 4 秒查一次，一旦开放自动加载课程名单。</p>
      <div class="actions">
        <button class="btn" id="btn-wait-toggle">开始探测</button>
        <button class="btn ghost" id="btn-wait-stop">停止</button>
      </div>
      <div class="log" id="log"></div>
    </section>

    <!-- 课程名单 -->
    <section class="card hidden" id="sec-list">
      <h2>3. 选择要抢的课程</h2>
      <p class="hint">勾选你想选的课（可多选），然后开始提交。提交前会查余量，有余才提交。</p>
      <div id="course-list" class="list"></div>
      <div class="actions">
        <button class="btn ghost" id="btn-course-reload">刷新名单</button>
        <button class="btn primary" id="btn-submit-start">开始提交所选课程</button>
      </div>
    </section>

    <!-- 提交状态 -->
    <section class="card hidden" id="sec-submit">
      <h2>4. 提交状态</h2>
      <div id="submit-status" class="list"></div>
      <div class="actions">
        <button class="btn danger" id="btn-submit-stop">停止提交</button>
      </div>
    </section>

    <div class="modal hidden" id="modal-about">
      <div class="modal-box">
        <h3>说明</h3>
        <p>本工具仅用于你本人账号的教务选课。使用温和并发（每门课 0.5~1 秒一次），请勿用于他人账号或激进请求，否则可能触发风控或违反校规。登录凭证只在本机内存，不落盘不上传。</p>
        <button class="btn" id="btn-about-close">知道了</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
